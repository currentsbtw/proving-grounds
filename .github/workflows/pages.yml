name: Deploy to GitHub Pages

# Builds the static SPA and publishes it at https://<owner>.github.io/<repo>/.
# The judge proxy is local-only by design, so the published build runs without
# the Judge drawer (the drawer reports the judge as offline). Nothing here
# needs a secret: card data comes from Scryfall in the browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:engine
      # Vite's base is the repo name, so asset URLs resolve under the Pages
      # sub-path. Locally `npm run preview:pages` serves dist the same way.
      #
      # DECK_FETCH_URL is the deployed deck-fetch Worker (workers/deck-fetch/,
      # set as a repository variable). It is baked in at build time because the
      # static build has no `/api` to proxy. Unset is a supported state: the app
      # falls back to `/api/deck`, which 404s here, and a pasted deck link then
      # shows the "export the list and paste it" instruction instead.
      - run: npx tsc -b && npx vite build --base "/${GITHUB_REPOSITORY#*/}/"
        env:
          VITE_DECK_FETCH_URL: ${{ vars.DECK_FETCH_URL }}
      # A SPA fallback: Pages serves 404.html for unknown paths, and the app has
      # no client-side routes, so the fallback only has to load the app itself.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
